name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        # BSD awk (macOS) and mawk (Ubuntu) both run prepare-diff.sh for real users.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: prepare-diff.sh self-check
        run: bash skills/review-mobile-pr/scripts/test-prepare-diff.sh

      - name: Every deprecation-table row matches a gate pattern
        working-directory: skills/review-mobile-pr/references
        run: |
          bad=0
          while IFS= read -r row; do
            if ! printf '%s\n' "$row" | grep -Eq -f deprecation-symbols.txt; then
              echo "::error::No deprecation-symbols.txt pattern matches row: $row"
              bad=1
            fi
          done < <(grep -h -E '^\| ' android-deprecations.md ios-deprecations.md | grep -v -E '^\| (Newly added|---)')
          exit $bad

      - name: The shipped skill never points at evals/
        run: |
          if grep -rn 'evals/' skills/review-mobile-pr --exclude=AGENTS.md --exclude=CLAUDE.md; then
            echo "::error::The skill ships alone; runtime files must not reference evals/"
            exit 1
          fi

      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck skills/review-mobile-pr/scripts/*.sh evals/*.sh

      - name: Every CLAUDE.md is a symlink to AGENTS.md
        run: |
          bad=0
          while IFS= read -r f; do
            if [ ! -L "$f" ] || [ "$(readlink "$f")" != AGENTS.md ]; then
              echo "::error file=$f::CLAUDE.md must be a relative symlink to AGENTS.md"
              bad=1
            fi
          done < <(find . -name CLAUDE.md -not -path './.git/*')
          exit $bad

      - name: android.md / ios.md tables of contents match their H2s
        working-directory: skills/review-mobile-pr/references
        run: |
          python3 -I - android.md ios.md <<'PY'
          import re, sys
          bad = 0
          for p in sys.argv[1:]:
              text = open(p).read()
              slug = lambda h: re.sub(r"[^\w\- ]", "", h.lower()).replace(" ", "-")
              h2 = [slug(h) for h in re.findall(r"^## (.+)$", text, re.M) if h != "Table of contents"]
              toc = re.findall(r"^\d+\. \[.*?\]\(#(.+?)\)$", text, re.M)
              if h2 != toc:
                  print(f"::error file={p}::TOC anchors {toc} != H2 slugs {h2}")
                  bad = 1
          sys.exit(bad)
          PY

      - name: Reference facts older than 150 days
        working-directory: skills/review-mobile-pr/references
        run: |
          python3 -I - <<'PY'
          import datetime, glob, re
          for p in sorted(glob.glob("*.md")):
              m = re.search(r"^Facts last updated: (\d{4}-\d{2}-\d{2})", open(p).read(), re.M)
              if m and (datetime.date.today() - datetime.date.fromisoformat(m.group(1))).days > 150:
                  print(f"::warning file={p}::Facts last updated {m.group(1)}; re-verify and bump the date")
          PY

      - name: Every eval fixture builds
        run: |
          work=$(mktemp -d)
          for f in evals/fixtures/*/; do bash evals/setup.sh "$f" "$work" > /dev/null; done
